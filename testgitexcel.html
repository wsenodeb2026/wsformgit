<!DOCTYPE html>
<html>
<head>
    <title>Excel Upload</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        table {
            border-collapse: collapse;
            margin-top: 20px;
            width: 100%;
        }

        th, td {
            border: 1px solid #999;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: #eee;
        }

        input {
            padding: 8px;
            margin-right: 10px;
        }

        button {
            padding: 8px 15px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h2>Excel Upload</h2>

    <input type="file" id="excelFile" accept=".xlsx,.xls">
<button onclick="uploadExcel()">Upload to MongoDB</button>

    <br><br>

    <input type="text" id="searchID" placeholder="Enter ID">
    <button onclick="searchRecord()">Search</button>

    <div id="searchResult"></div>

    <table id="excelTable">
        <thead></thead>
        <tbody></tbody>
    </table>

    <script>

    let excelData = [];

    document.getElementById("excelFile").addEventListener("change", function(event) {

        const file = event.target.files[0];

        if (!file) {
            return;
        }

        const reader = new FileReader();

        reader.onload = function(e) {

            const data = new Uint8Array(e.target.result);

            const workbook = XLSX.read(data, {
                type: "array"
            });

            const sheetName = workbook.SheetNames[0];

            const worksheet = workbook.Sheets[sheetName];

            excelData = XLSX.utils.sheet_to_json(worksheet);

            displayExcelData();

        };

        reader.readAsArrayBuffer(file);

    });


    function displayExcelData() {

        const tableHead = document.querySelector("#excelTable thead");
        const tableBody = document.querySelector("#excelTable tbody");

        tableHead.innerHTML = "";
        tableBody.innerHTML = "";

        if (excelData.length === 0) {
            return;
        }

        const headers = Object.keys(excelData[0]);

        let headerRow = "<tr>";

        headers.forEach(function(header) {
            headerRow += "<th>" + header + "</th>";
        });

        headerRow += "</tr>";

        tableHead.innerHTML = headerRow;


        excelData.forEach(function(row) {

            let tableRow = "<tr>";

            headers.forEach(function(header) {

                tableRow += "<td>" + (row[header] || "") + "</td>";

            });

            tableRow += "</tr>";

            tableBody.innerHTML += tableRow;

        });

    }


   function searchRecord() {

    const id = document.getElementById("searchID").value.trim();

    const index = excelData.findIndex(function(row) {
        return String(row.ID).trim() === id;
    });

    const resultDiv = document.getElementById("searchResult");

    if (index === -1) {

        resultDiv.innerHTML = "<p>Record not found.</p>";

        return;
    }

    const result = excelData[index];

    resultDiv.innerHTML = `

        <h3>Record Found</h3>

        <p><b>ID:</b> ${result.ID}</p>

        <p>
            <b>Name:</b><br>
            <input type="text" id="editName" value="${result.Name || ""}">
        </p>

        <p>
            <b>Mobile:</b><br>
            <input type="text" id="editMobile" value="${result.Mobile || ""}">
        </p>

        <p>
            <b>Email:</b><br>
            <input type="email" id="editEmail" value="${result.Email || ""}">
        </p>

        <p>
            <b>Remarks:</b><br>
            <textarea id="editRemarks" rows="4" cols="40">${result.Remarks || ""}</textarea>
        </p>

        <button onclick="saveRecord(${index})">
            Save Changes
        </button>
    `;
}
function saveRecord(index) {

    excelData[index].Name =
        document.getElementById("editName").value;

    excelData[index].Mobile =
        document.getElementById("editMobile").value;

    excelData[index].Email =
        document.getElementById("editEmail").value;

    excelData[index].Remarks =
        document.getElementById("editRemarks").value;

    alert("Changes saved in the current Excel data.");

    displayExcelData();
}
        
async function saveRecord(index) {

    const record = {
        id: excelData[index].ID,
        name: document.getElementById("editName").value,
        mobile: document.getElementById("editMobile").value,
        email: document.getElementById("editEmail").value,
        remarks: document.getElementById("editRemarks").value
    };

    const response = await fetch(
        "https://wsform-back.onrender.com/update-record",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(record)
        }
    );

    const result = await response.json();

    if (result.success) {
        alert("MongoDB updated successfully");

        excelData[index].Name = record.name;
        excelData[index].Mobile = record.mobile;
        excelData[index].Email = record.email;
        excelData[index].Remarks = record.remarks;

        displayExcelData();
    } else {
        alert("Update failed");
    }
}
        
        
    </script>

</body>
</html>
