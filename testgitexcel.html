<!DOCTYPE html>
<html>
<head>
    <title>Excel Upload</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        table {
            border-collapse: collapse;
            margin-top: 20px;
            width: 100%;
        }

        th, td {
            border: 1px solid #999;
            padding: 8px;
        }

        th {
            background-color: #eee;
        }

        input, button {
            padding: 8px;
            margin: 5px;
        }
    </style>
</head>

<body>

<h2>Excel Upload</h2>

<input type="file" id="excelFile" accept=".xlsx,.xls">

<button onclick="uploadExcel()">
    Upload to MongoDB
</button>

<br><br>

<input type="text" id="searchID" placeholder="Enter ID">

<button onclick="searchRecord()">
    Search
</button>

<div id="searchResult"></div>

<table id="mongoTable" border="1" cellpadding="8" cellspacing="0">
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Mobile</th>
            <th>Email</th>
            <th>Remarks</th>
            <th>Date</th>
        </tr>
    </thead>

    <tbody id="mongoData">
    </tbody>
</table>


<script>

let excelData = [];


/* READ EXCEL FILE */

document.getElementById("excelFile").addEventListener("change", function(event) {

    const file = event.target.files[0];

    if (!file) {
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {

        const data = new Uint8Array(e.target.result);

        const workbook = XLSX.read(data, {
            type: "array"
        });

        const sheetName = workbook.SheetNames[0];

        const worksheet = workbook.Sheets[sheetName];

        excelData = XLSX.utils.sheet_to_json(worksheet);

        displayExcelData();

    };

    reader.readAsArrayBuffer(file);

});


/* DISPLAY EXCEL */

function displayExcelData() {

    const tableHead = document.querySelector("#excelTable thead");
    const tableBody = document.querySelector("#excelTable tbody");

    tableHead.innerHTML = "";
    tableBody.innerHTML = "";

    if (excelData.length === 0) {
        return;
    }

    const headers = Object.keys(excelData[0]);

    let headerRow = "<tr>";

    headers.forEach(function(header) {
        headerRow += "<th>" + header + "</th>";
    });

    headerRow += "</tr>";

    tableHead.innerHTML = headerRow;


    excelData.forEach(function(row) {

        let tableRow = "<tr>";

        headers.forEach(function(header) {

            tableRow += "<td>" + (row[header] || "") + "</td>";

        });

        tableRow += "</tr>";

        tableBody.innerHTML += tableRow;

    });

}


/* UPLOAD EXCEL TO MONGODB */

async function uploadExcel() {

    const file = document.getElementById("excelFile").files[0];

    if (!file) {
        alert("Please select an Excel file first.");
        return;
    }

    alert("Uploading Excel...");

    try {

        const reader = new FileReader();

        reader.onload = async function(e) {

            try {

                const base64 = e.target.result.split(",")[1];

                const response = await fetch(
                    "https://wsform-back.onrender.com/upload-excel",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            file: base64
                        })
                    }
                );

                const result = await response.json();

                alert(result.message);

            } catch (error) {

                console.error(error);

                alert("Error connecting to Render.");

            }

        };

        reader.readAsDataURL(file);

    } catch (error) {

        console.error(error);

        alert("Upload failed.");

    }

}


/* SEARCH RECORD */

async function searchRecord() {

    const id = document.getElementById("searchID").value.trim();

    if (!id) {
        alert("Please enter an ID.");
        return;
    }

    try {

        const response = await fetch(
            "https://wsform-back.onrender.com/search/" +
            encodeURIComponent(id)
        );

        const result = await response.json();

        const resultDiv = document.getElementById("searchResult");

        if (!result.success) {

            resultDiv.innerHTML = "<p>Record not found.</p>";

            return;
        }

        const record = result.data;

        resultDiv.innerHTML = `

            <h3>Record Found</h3>

            <p><b>ID:</b> ${record.id}</p>

            <p>
                <b>Name:</b><br>
                <input type="text"
                       id="editName"
                       value="${record.name || ""}">
            </p>

            <p>
                <b>Mobile:</b><br>
                <input type="text"
                       id="editMobile"
                       value="${record.mobile || ""}">
            </p>

            <p>
                <b>Email:</b><br>
                <input type="email"
                       id="editEmail"
                       value="${record.email || ""}">
            </p>

            <p>
                <b>Remarks:</b><br>
                <textarea id="editRemarks"
                          rows="4"
                          cols="40">${record.remarks || ""}</textarea>
            </p>

            <button onclick="saveMongoRecord('${record.id}')">
                Save Changes
            </button>

        `;

    } catch (error) {

        console.error(error);

        alert("Unable to connect to MongoDB server.");

    }

}

    async function saveMongoRecord(id) {

    const record = {

        id: id,

        name: document.getElementById("editName").value,

        mobile: document.getElementById("editMobile").value,

        email: document.getElementById("editEmail").value,

        remarks: document.getElementById("editRemarks").value

    };


    try {

        const response = await fetch(
            "https://wsform-back.onrender.com/update-record",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(record)
            }
        );


        const result = await response.json();


        if (result.success) {

            alert("MongoDB updated successfully.");

        } else {

            alert("Update failed.");

        }

    } catch (error) {

        console.error(error);

        alert("Unable to connect to server.");

    }

}


/* UPDATE MONGODB */

async function saveRecord(index) {

    const record = {

        id: excelData[index].ID,

        name: document.getElementById("editName").value,

        mobile: document.getElementById("editMobile").value,

        email: document.getElementById("editEmail").value,

        remarks: document.getElementById("editRemarks").value

    };


    try {

        const response = await fetch(
            "https://wsform-back.onrender.com/update-record",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(record)
            }
        );


        const result = await response.json();


        if (result.success) {

            alert("MongoDB updated successfully.");

            excelData[index].Name = record.name;

            excelData[index].Mobile = record.mobile;

            excelData[index].Email = record.email;

            excelData[index].Remarks = record.remarks;

            location.reload();

            displayExcelData();

        } else {

            alert("Update failed.");

        }

    } catch (error) {

        console.error(error);

        alert("Error connecting to Render.");

    }

}
    async function loadMongoData() {

    try {

        const response = await fetch(
            "https://wsform-back.onrender.com/data"
        );

        const data = await response.json();

        const tableBody =
            document.getElementById("mongoData");

        tableBody.innerHTML = "";

        data.forEach(function(item) {

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${item.id || ""}</td>
                <td>${item.name || ""}</td>
                <td>${item.mobile || ""}</td>
                <td>${item.email || ""}</td>
                <td>${item.remarks || ""}</td>
                <td>
                    ${item.createdAt
                        ? new Date(item.createdAt).toLocaleString()
                        : ""}
                </td>
            `;

            tableBody.appendChild(row);

        });

    } catch (error) {

        console.error(error);

        alert("Unable to load MongoDB data.");

    }

}

loadMongoData();

</script>

</body>
</html>
