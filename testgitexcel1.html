<script>

const API = "";


// =====================================
// LOAD EXCEL LIST
// =====================================

async function loadBatches() {

    const select =
        document.getElementById(
            "batchSelect"
        );

    try {

        select.innerHTML =
            "<option value=''>Loading...</option>";


        const response =
            await fetch(
                API +
                "/batches?t=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load Excel list"
            );

        }


        const batches =
            await response.json();


        select.innerHTML =
            "";


        if (
            !batches ||
            batches.length === 0
        ) {

            select.innerHTML =
                "<option value=''>" +
                "No Excel files found" +
                "</option>";

            document.getElementById(
                "status"
            ).innerText =
                "No Excel files found.";

            return;

        }


        batches.forEach(
            batch => {

                const option =
                    document.createElement(
                        "option"
                    );


                option.value =
                    batch._id;


                option.textContent =
                    batch.fileName +
                    " | " +
                    new Date(
                        batch.uploadTime
                    ).toLocaleString() +
                    " | " +
                    batch.recordCount +
                    " records";


                select.appendChild(
                    option
                );

            }
        );


        // Check if a batch was passed
        // in the URL after upload

        const params =
            new URLSearchParams(
                window.location.search
            );


        const urlBatch =
            params.get("batch");


        if (
            urlBatch &&
            batches.some(
                batch =>
                    batch._id === urlBatch
            )
        ) {

            select.value =
                urlBatch;

        }
        else {

            // Select latest Excel

            select.value =
                batches[0]._id;

        }


        loadSelectedBatch();

    }

    catch (error) {

        console.error(
            error
        );


        select.innerHTML =
            "<option value=''>" +
            "Error loading Excel list" +
            "</option>";


        document.getElementById(
            "status"
        ).innerText =
            "Error: " +
            error.message;

    }

}


// =====================================
// LOAD SELECTED EXCEL
// =====================================

function loadSelectedBatch() {

    const select =
        document.getElementById(
            "batchSelect"
        );


    const batchId =
        select.value;


    if (!batchId) {

        return;

    }


    loadData(
        batchId
    );

}


// =====================================
// LOAD SELECTED EXCEL DATA
// =====================================

async function loadData(
    batchId
) {

    const status =
        document.getElementById(
            "status"
        );


    status.innerText =
        "Loading Excel data...";


    try {

        const response =
            await fetch(

                API +
                "/data?batch=" +
                encodeURIComponent(
                    batchId
                ) +
                "&t=" +
                Date.now(),

                {
                    method: "GET",
                    cache: "no-store"
                }

            );


        if (!response.ok) {

            throw new Error(
                "Unable to load data"
            );

        }


        const result =
            await response.json();


        console.log(
            "Batch:",
            result.batchId
        );


        console.log(
            "File:",
            result.fileName
        );


        console.log(
            "Columns:",
            result.columns
        );


        console.log(
            "Records:",
            result.data
        );


        // FILE INFORMATION

        const fileInfo =
            document.getElementById(
                "fileInfo"
            );


        fileInfo.innerText =
            "File: " +
            (result.fileName || "") +
            " | Uploaded: " +
            (
                result.uploadTime
                    ? new Date(
                        result.uploadTime
                    ).toLocaleString()
                    : ""
            );


        // DISPLAY DATA

        displayData(
            result.columns,
            result.data
        );


        status.innerText =
            result.data.length +
            " records loaded.";

    }

    catch (error) {

        console.error(
            error
        );


        status.innerText =
            "Error: " +
            error.message;

    }

}
