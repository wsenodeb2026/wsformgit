<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Dynamic Excel Report</title>

    <style>

        body {
            font-family: Arial;
            margin: 20px;
        }

        button {
            padding: 8px 14px;
            margin: 4px;
            cursor: pointer;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #999;
            padding: 8px;
            text-align: left;
        }

        th {
            background: #eeeeee;
        }

        input {
            padding: 6px;
            width: 95%;
            box-sizing: border-box;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<h2>MongoDB Dynamic Report</h2>


<button
    onclick="location.href='index1.html'">

    ← Home

</button>


<button
    onclick="loadData()">

    Refresh Data

</button>


<div id="status">
    Loading...
</div>


<table>

    <thead id="tableHead"></thead>

    <tbody id="tableBody"></tbody>

</table>


<script>

const API =
    "https://enodeb26.onrender.com";


// =====================================
// LOAD LATEST EXCEL
// =====================================

async function loadData() {

    const status =
        document.getElementById(
            "status"
        );


    status.innerText =
        "Loading latest Excel data...";


    try {

        const response =
            await fetch(
                API + "/data"
            );


        if (
            !response.ok
        ) {

            throw new Error(
                "Unable to load data"
            );

        }


        const result =
            await response.json();


        displayData(
            result.columns,
            result.data
        );


        status.innerText =
            result.data.length +
            " records loaded.";

    }

    catch (error) {

        console.error(
            error
        );


        status.innerText =
            "Error: " +
            error.message;

    }

}


// =====================================
// DISPLAY DATA
// =====================================

function displayData(
    columns,
    data
) {

    const head =
        document.getElementById(
            "tableHead"
        );


    const body =
        document.getElementById(
            "tableBody"
        );


    head.innerHTML =
        "";


    body.innerHTML =
        "";


    if (
        !data ||
        data.length === 0
    ) {

        body.innerHTML =
            "<tr>" +
            "<td>No data found</td>" +
            "</tr>";

        return;

    }


    // =================================
    // HEADER
    // =================================

    let header =
        "<tr>";


    header +=
        "<th>ID</th>";


    columns.forEach(
        column => {

            header +=
                "<th>" +
                escapeHtml(
                    column
                ) +
                "</th>";

        }
    );


    header +=
        "<th>Action</th>";


    header +=
        "</tr>";


    head.innerHTML =
        header;


    // =================================
    // DATA
    // =================================

    data.forEach(
        record => {

            const row =
                document.createElement(
                    "tr"
                );


            // ID
            const idCell =
                document.createElement(
                    "td"
                );


            idCell.innerText =
                record._id;


            row.appendChild(
                idCell
            );


            // Excel columns
            columns.forEach(
                column => {

                    const cell =
                        document.createElement(
                            "td"
                        );


                    const input =
                        document.createElement(
                            "input"
                        );


                    input.type =
                        "text";


                    input.value =
                        record[column] ??
                        "";


                    input.dataset.field =
                        column;


                    input.disabled =
                        true;


                    cell.appendChild(
                        input
                    );


                    row.appendChild(
                        cell
                    );

                }
            );


            // Action
            const actionCell =
                document.createElement(
                    "td"
                );


            const editButton =
                document.createElement(
                    "button"
                );


            editButton.innerText =
                "Edit";


            editButton.onclick =
                function () {

                    enableEdit(
                        row,
                        record._id
                    );

                };


            actionCell.appendChild(
                editButton
            );


            row.appendChild(
                actionCell
            );


            body.appendChild(
                row
            );

        }
    );

}


// =====================================
// EDIT
// =====================================

function enableEdit(
    row,
    id
) {

    const inputs =
        row.querySelectorAll(
            "input"
        );


    inputs.forEach(
        input => {

            input.disabled =
                false;

        }
    );


    const actionCell =
        row.lastElementChild;


    actionCell.innerHTML =
        "";


    const saveButton =
        document.createElement(
            "button"
        );


    saveButton.innerText =
        "Save";


    saveButton.onclick =
        function () {

            saveRecord(
                row,
                id
            );

        };


    actionCell.appendChild(
        saveButton
    );


    const cancelButton =
        document.createElement(
            "button"
        );


    cancelButton.innerText =
        "Cancel";


    cancelButton.onclick =
        function () {

            loadData();

        };


    actionCell.appendChild(
        cancelButton
    );

}


// =====================================
// SAVE
// =====================================

async function saveRecord(
    row,
    id
) {

    const inputs =
        row.querySelectorAll(
            "input"
        );


    const updateData =
        {};


    inputs.forEach(
        input => {

            updateData[
                input.dataset.field
            ] =
                input.value;

        }
    );


    try {

        const response =
            await fetch(

                API +
                "/data/" +
                id,

                {

                    method:
                        "PUT",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(
                            updateData
                        )

                }

            );


        const result =
            await response.json();


        if (
            !response.ok
        ) {

            throw new Error(
                result.message ||
                "Update failed"
            );

        }


        alert(
            "Record updated successfully."
        );


        loadData();

    }

    catch (error) {

        console.error(
            error
        );


        alert(
            "Update failed: " +
            error.message
        );

    }

}


// =====================================
// HTML SAFETY
// =====================================

function escapeHtml(
    value
) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


// =====================================
// AUTOMATIC LOAD
// =====================================

window.onload =
    function () {

        loadData();

    };

</script>

</body>

</html>
