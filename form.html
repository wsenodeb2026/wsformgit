
<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Excel Upload</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        button {
            cursor: pointer;
        }

        #status {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<button onclick="location.href='index.html'">← Home</button>

<h2>Upload Excel</h2>

<input type="file" id="excelFile" accept=".xlsx,.xls">

<br>

<button type="button" id="uploadBtn">
    Upload to MongoDB
</button>

<p id="status"></p>

<script>

document.getElementById("uploadBtn").addEventListener("click", uploadExcel);

async function uploadExcel() {

    const status = document.getElementById("status");
    const fileInput = document.getElementById("excelFile");

    // First confirmation that button is working
    status.innerText = "Button clicked...";

    if (!fileInput.files || fileInput.files.length === 0) {

        status.innerText = "Please select an Excel file first.";

        alert("Please select an Excel file first.");

        return;
    }

    const file = fileInput.files[0];

    status.innerText = "Reading Excel file...";

    try {

        // Read Excel file
        const arrayBuffer = await file.arrayBuffer();

        const workbook = XLSX.read(arrayBuffer, {
            type: "array"
        });

        const sheetName = workbook.SheetNames[0];

        const worksheet = workbook.Sheets[sheetName];

        const jsonData = XLSX.utils.sheet_to_json(
            worksheet,
            {
                defval: ""
            }
        );

        if (!jsonData || jsonData.length === 0) {

            status.innerText =
                "Excel file contains no data.";

            return;
        }

        status.innerText =
            "Excel read successfully. Uploading " +
            jsonData.length +
            " records...";

        // Send data to Render
        const response = await fetch(
            "https://enodeb26.onrender.com/upload-excel",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    data: jsonData
                })
            }
        );

        const result = await response.json();

        if (!response.ok) {

            throw new Error(
                result.message || "Upload failed"
            );
        }

        status.innerText =
            "SUCCESS: " +
            result.insertedCount +
            " records uploaded.";

        alert(
            "Excel uploaded successfully.\n\n" +
            result.insertedCount +
            " records inserted into MongoDB."
        );

    } catch (error) {

        console.error("UPLOAD ERROR:", error);

        status.innerText =
            "Upload failed: " + error.message;

        alert(
            "Upload failed.\n\n" +
            error.message
        );
    }
}

</script>

</body>
</html>
