<!DOCTYPE html>
<html>
<head>
    <title>Form Report</title>
</head>

<body>

    <h2>Form Report</h2>

    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>Name</th>
                <th>Mobile</th>
                <th>Email</th>
                <th>Remarks</th>
                <th>Date</th>
            </tr>
        </thead>

        <tbody id="reportData">
        </tbody>
    </table>

    <script>

    async function loadData() {

        try {

            const response = await fetch(
                "https://wsform-back.onrender.com/data"
            );

            const data = await response.json();

            const tableBody = document.getElementById("reportData");

            tableBody.innerHTML = "";

            data.forEach(item => {

                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${item.name || ""}</td>
                    <td>${item.mobile || ""}</td>
                    <td>${item.email || ""}</td>
                    <td>${item.remarks || ""}</td>
                    <td>${item.createdAt ? new Date(item.createdAt).toLocaleString() : ""}</td>
                `;

                tableBody.appendChild(row);

            });

        } catch (error) {

            console.error(error);
            alert("Unable to load report.");

        }

    }

    loadData();

    </script>

</body>
</html>
