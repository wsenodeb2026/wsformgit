
<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Excel Upload</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>

        body {
            font-family: Arial;
            margin: 30px;
        }

        input {
            padding: 8px;
            margin: 10px 0;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<h2>Upload Excel</h2>

<button
    onclick="location.href='index1.html'">
    ← Home
</button>

<br><br>

<input
    type="file"
    id="excelFile"
    accept=".xlsx,.xls">

<br>

<button
    type="button"
    id="uploadButton">

    Upload to MongoDB

</button>

<div id="status"></div>


<script>

const API = "";


const fileInput =
    document.getElementById(
        "excelFile"
    );


const uploadButton =
    document.getElementById(
        "uploadButton"
    );


const status =
    document.getElementById(
        "status"
    );


uploadButton.onclick =
    uploadExcel;


async function uploadExcel() {

    if (
        !fileInput.files ||
        fileInput.files.length === 0
    ) {

        status.innerText =
            "Please select an Excel file.";

        return;

    }


    try {

        status.innerText =
            "Reading Excel...";


        const file =
            fileInput.files[0];


        const buffer =
            await file.arrayBuffer();


        const workbook =
            XLSX.read(
                buffer,
                {
                    type: "array"
                }
            );


        const sheetName =
            workbook.SheetNames[0];


        const worksheet =
            workbook.Sheets[
                sheetName
            ];


        const data =
            XLSX.utils.sheet_to_json(
                worksheet,
                {
                    defval: ""
                }
            );


        if (
            data.length === 0
        ) {

            status.innerText =
                "Excel contains no data.";

            return;

        }


        const columns =
            Object.keys(
                data[0]
            );


        status.innerText =
            "Uploading " +
            data.length +
            " records...";


        const response =
            await fetch(
                API +
                "/upload-excel",
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            data:
                                data

                        })

                }
            );


        const result =
            await response.json();


        if (
            !response.ok
        ) {

            throw new Error(
                result.message ||
                "Upload failed"
            );

        }


        console.log(
            "Batch ID:",
            result.batchId
        );


        console.log(
            "Columns:",
            result.columns
        );


        status.innerText =
            "SUCCESS! " +
            result.insertedCount +
            " records uploaded.";


        alert(
            "Excel uploaded successfully.\n\n" +

            "Records: " +
            result.insertedCount +

            "\n\nColumns:\n" +
            columns.join(", ")
        );


        // Open latest report
        window.location.href =
            "excel1.html";


    }

    catch (error) {

        console.error(
            error
        );


        status.innerText =
            "Upload failed: " +
            error.message;

    }

}

</script>

</body>

</html>
